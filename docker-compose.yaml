services:
  exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-metrics-exporter:dev
    container_name: aws-metrics-exporter
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - localstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

  # LocalStack provides a CloudWatch-compatible endpoint for local dev.
  # Seed it after startup with awslocal:
  #   awslocal cloudwatch put-metric-data --namespace AWS/EC2 \
  #     --metric-name CPUUtilization --value 42 \
  #     --dimensions InstanceId=i-0abc123
  localstack:
    image: localstack/localstack:latest
    container_name: aws-metrics-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: "cloudwatch"
      DEBUG: "0"
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: aws-metrics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - exporter
    restart: unless-stopped
    networks:
      - default

volumes:
  prometheus-data:
    driver: local

networks:
  default:
    name: aws-metrics-net
