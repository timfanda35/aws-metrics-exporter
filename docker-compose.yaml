services:
  exporter:
    build:
      context: .
      dockerfile: Dockerfile
    image: aws-metrics-exporter:dev
    container_name: aws-metrics-exporter
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: aws-metrics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - exporter
    restart: unless-stopped
    networks:
      - default

  grafana:
    image: grafana/grafana:11.6.0
    container_name: aws-metrics-grafana
    ports:
      - "3000:3000"
    environment:
      # Local development only: anonymous admin, no login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - default

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: aws-metrics-net
