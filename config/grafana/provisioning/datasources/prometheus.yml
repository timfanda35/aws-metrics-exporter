apiVersion: 1

# Recreate the datasource so its uid is the fixed "prometheus" the dashboard
# refers to (an earlier auto-generated uid would otherwise conflict).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
